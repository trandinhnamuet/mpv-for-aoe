# mpv-for-aoe: build the Windows player and publish it.
#
# - every push to the aoe branch builds mpv-for-aoe-win64.zip as a run artifact;
# - a tag aoe-v* additionally publishes it as a GitHub Release with a build
#   provenance attestation, so anyone can check which commit and workflow
#   produced the exe:  gh attestation verify mpv.exe -R trandinhnamuet/mpv-for-aoe
#
# The build itself is upstream's static cross build (ci/build-mingw64-full.sh)
# in the public BtbN FFmpeg-Builds container, unchanged.
name: aoe-release

on:
  push:
    branches: [aoe]
    tags: ['aoe-v*']
    paths-ignore:
      - 'DOCS/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  win64:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/btbn/ffmpeg-builds/win64-gpl:latest
      env:
        WINEPREFIX: /tmp/wine
    steps:
      - uses: actions/checkout@v7

      - name: Build
        id: build
        run: ./ci/build-mingw64-full.sh

      - name: Print meson log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: cat ./build/meson-logs/meson-log.txt

      - name: Functional test
        run: cd artifact && wine ./mpv.com -v --no-config --version

      - name: Package
        id: pkg
        run: |
          VER=$(grep VERSION "$(find . -path '*/common/version.h' -type f | head -n 1)" | cut -d'"' -f2)
          NAME=mpv-for-aoe-win64
          mkdir -p "$NAME/portable_config"
          cp -p artifact/mpv.exe artifact/mpv.com artifact/LICENSE.GPL "$NAME/"
          cp -p README.md "$NAME/README.md"
          cp -p etc/mpv.conf "$NAME/portable_config/mpv.conf.example"
          echo "mpv $VER" > "$NAME/VERSION.txt"
          echo "source: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}" >> "$NAME/VERSION.txt"
          (cd "$NAME" && sha256sum mpv.exe mpv.com > SHA256SUMS.txt)
          apt-get update -qq && apt-get install -y -qq zip > /dev/null
          zip -qr "$NAME.zip" "$NAME"
          sha256sum "$NAME.zip" | tee "$NAME.zip.sha256"
          {
            echo "Bản Windows của mpv-for-aoe, dựa trên mpv $VER, build từ commit ${{ github.sha }}."
            echo
            echo "Tải **$NAME.zip**, giải nén, kéo video vào \`mpv.exe\`. Hướng dẫn, danh sách thay đổi và cách kiểm tra file:"
            echo "${{ github.server_url }}/${{ github.repository }}#readme"
            echo
            echo "SHA-256 của zip: \`$(cut -d' ' -f1 "$NAME.zip.sha256")\`"
          } > release-notes.md
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}-${{ github.run_id }}
          path: ${{ steps.pkg.outputs.name }}/*

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/aoe-v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.name }}/mpv.exe
            ${{ steps.pkg.outputs.name }}/mpv.com

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/aoe-v')
        uses: softprops/action-gh-release@v3
        with:
          name: mpv-for-aoe ${{ github.ref_name }} (mpv ${{ steps.pkg.outputs.version }})
          body_path: release-notes.md
          files: |
            ${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.name }}.zip.sha256
